name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceptar Licencias de Android (Modo Nativo)
      run: |
        # 1. Forzar la aprobación inyectando "yes" en todos los gestores de licencias posibles
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | ${ANDROID_HOME}/tools/bin/sdkmanager --licenses || true
        
        # 2. Asegurar que las variables queden bien registradas para el compilador de Rust
        echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk-bundle" >> $GITHUB_ENV

    - name: Instalar Rust y Target Android
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: aarch64-linux-android

    - name: Instalar cargo-apk
      run: cargo install cargo-apk

    - name: Compilar APK Específico
      run: cargo apk build --release --package gridcraft

    - name: Guardar APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: gridcraft-android-apk
        path: target/release/apk/*.apk
        
