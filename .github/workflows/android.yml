name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceptar Licencias e Instalar Plataformas Requeridas
      run: |
        # 1. Firmar los términos de uso de Google de forma automática
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | ${ANDROID_HOME}/tools/bin/sdkmanager --licenses || true
        
        # 2. Descargar e instalar específicamente la Plataforma 30 solicitada por cargo-apk
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30"

    - name: Instalar Rust y Target Android
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: aarch64-linux-android

    - name: Instalar cargo-apk
      run: cargo install cargo-apk

    - name: Compilar APK Específico
      run: |
        # Localizamos el NDK preinstalado en el servidor de forma dinámica
        export ANDROID_NDK_ROOT=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
        echo "Usando NDK en ruta: $ANDROID_NDK_ROOT"
        
        # Ejecutamos la compilación final
        cargo apk build --release --package gridcraft

    - name: Guardar APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: gridcraft-android-apk
        path: target/release/apk/*.apk

        
