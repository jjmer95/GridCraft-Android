name: Build Android Hybrid APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar herramientas de Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Instalar Trunk (compilador web de Rust)
        run: cargo install --locked trunk

      - name: Compilar versión WebAssembly
        env:
          RUSTFLAGS: "-A dead_code"
        run: |
          TARGET_DIR=$(dirname $(find . -name "index.html" -not -path "*/.**" | head -n 1))
          echo "Carpeta web encontrada en: $TARGET_DIR"
          cd "$TARGET_DIR"
          # Forzamos la creación del directorio de salida exacto
          trunk build --release --dist dist
          echo "WEB_DIR=$GITHUB_WORKSPACE/$TARGET_DIR" >> $GITHUB_ENV

      # CORRECCIÓN DEFINITIVA: Aseguramos la existencia física y la ruta exacta absoluta
      - name: Crear contenedor Android con Capacitor
        run: |
          cd ${{ env.WEB_DIR }}
          mkdir -p dist
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init GridCraft com.jjmer95.gridcraft --web-dir="${{ env.WEB_DIR }}/dist"
          npx cap add android
          npx cap sync

      - name: Configurar Java JDK 17 (para Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Compilamos el APK contenedor final
      - name: Compilar APK Final
        run: |
          cd ${{ env.WEB_DIR }}/android
          ./gradlew assembleRelease

      - name: Subir APK final como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GridCraft-Web-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/*.apk
