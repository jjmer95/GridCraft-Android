name: Build Android Hybrid APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar herramientas de Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Instalar Trunk (compilador web de Rust)
        run: cargo install --locked trunk

      # CORRECCIÓN: Compilamos directamente en la raíz del repositorio
      - name: Compilar versión WebAssembly
        run: |
          trunk build --release

      # Inicializamos el contenedor móvil nativo en la raíz
      - name: Crear contenedor Android con Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init GridCraft com.jjmer95.gridcraft --web-dir=dist
          npx cap add android
          npx cap sync

      - name: Configurar Java JDK 17 (para Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Compilamos el APK contenedor final desde la carpeta generada por Capacitor
      - name: Compilar APK Final
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Subir APK final como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GridCraft-Web-APK
          path: android/app/build/outputs/apk/release/*.apk

