name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK Automático
      uses: android-actions/setup-android@v3
      with:
        log-accepted-licenses: false

    - name: Instalar Rust y Target Android
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: aarch64-linux-android

    - name: Instalar cargo-apk
      run: cargo install cargo-apk

    - name: Compilar APK Específico
      run: cargo apk build --release --package gridcraft

    - name: Guardar APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: gridcraft-android-apk
        path: target/release/apk/*.apk
        
