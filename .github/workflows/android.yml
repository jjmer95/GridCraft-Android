name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar herramientas de Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      - name: Instalar cargo-apk
        run: cargo install cargo-apk

      - name: Configurar variables del SDK y NDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV

      # Compilamos apuntando al paquete específico en lugar de usar --workspace
      - name: Compilar APK en modo Release
        run: |
          cargo apk build --release -p gridcraft

      - name: Subir APK final como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GridCraft-Android-APK
          path: target/aarch64-linux-android/release/apk/*.apk

