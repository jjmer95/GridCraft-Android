name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar y licenciar Android SDK manualmente
      run: |
        # 1. Crear directorios para el SDK
        mkdir -p mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        
        # 2. Descargar las herramientas oficiales de línea de comandos de Android
        wget -q https://google.com
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        
        # 3. Configurar variables de entorno indispensables para Cargo-apk
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$HOME/android-sdk/ndk-bundle" >> $GITHUB_ENV
        export ANDROID_HOME=$HOME/android-sdk
        
        # 4. FORZAR la aceptación de todas las licencias antes de instalar nada
        yes | ./latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME
        
        # 5. Instalar las plataformas necesarias para compilar aplicaciones móviles
        ./latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk-bundle" --sdk_root=$ANDROID_HOME

    - name: Instalar Rust y Target Android
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: aarch64-linux-android

    - name: Instalar cargo-apk
      run: cargo install cargo-apk

    - name: Compilar APK Específico
      run: cargo apk build --release --package gridcraft

    - name: Guardar APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: gridcraft-android-apk
        path: target/release/apk/*.apk
