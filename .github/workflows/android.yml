name: Build Android APK

on:
  workflow_dispatch: # Esto te permite activar la compilación manualmente con un botón

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar herramientas de Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      - name: Instalar herramientas cargo-apk
        run: |
          cargo install cargo-apk

      - name: Compilar APK en modo Release
        run: |
          cargo apk build --release

      - name: Subir APK final como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GridCraft-Android-APK
          path: target/debug/apk/*.apk
